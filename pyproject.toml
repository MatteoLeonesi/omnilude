[project]
name = "omnilude"
version = "0.4.1"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<2",
    "pydantic>=2.13.5",
]

[project.scripts]
omnilude = "omnilude.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 79
extend-exclude = [".omnilude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
